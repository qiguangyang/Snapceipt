name: Snapceipt
options:
  bundleIdPrefix: app.snapceipt
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Snapceipt:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Snapceipt
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.snapceipt.Snapceipt
        INFOPLIST_FILE: Snapceipt/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  SnapceiptTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SnapceiptTests
    dependencies:
      - target: Snapceipt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.snapceipt.SnapceiptTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Snapceipt.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Snapceipt"
        BUNDLE_LOADER: "$(TEST_HOST)"
  SnapceiptUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SnapceiptUITests
      - path: Snapceipt/Shared/AccessibilityID.swift   # shared constants (UI tests can't @testable-import the app)
    dependencies:
      - target: Snapceipt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.snapceipt.SnapceiptUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Snapceipt
schemes:
  Snapceipt:
    build:
      targets:
        Snapceipt: all
        SnapceiptTests: [test]
        SnapceiptUITests: [test]
    test:
      targets:
        - SnapceiptTests
        - SnapceiptUITests
      gatherCoverageData: false
