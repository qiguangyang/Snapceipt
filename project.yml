name: Snapceipt
options:
  bundleIdPrefix: app.snapceipt
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
# Build configurations. Staging is a DEBUG-type config (keeps DEBUG features + dev
# signing) that bakes the staging API host into the build, so a Staging build always
# talks to staging no matter how it's launched (icon tap, not just `devicectl --env`).
configs:
  Debug: debug
  Staging: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.10"
    # Empty by default -> the app falls back to the prod API. Overridden per-config
    # (Staging) and surfaced to the app via Info.plist SNAPCEIPT_API_HOST.
    SNAPCEIPT_API_HOST: ""
    # Release archives need (1) DEVELOPMENT_TEAM filled from beta-launch.env
    # (see beta-launch.env.example) and (2) `bundle exec fastlane certs` to
    # install the match profile. Don't fix signing in Xcode's UI — the
    # .xcodeproj is generated from this file.
    DEVELOPMENT_TEAM: "2SU47GHJQX"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Snapceipt:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Snapceipt
        excludes:
          - "Info.plist"
          - "Snapceipt.entitlements"
          - "Snapceipt.Release.entitlements"
      # Shared App Group bridge — compiled into both the app and the Share Extension.
      - path: SnapceiptShareExtension/ShareExtensionStore.swift
    dependencies:
      # Embeds the Share Extension into the app bundle's PlugIns.
      - target: SnapceiptShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.snapceipt.Snapceipt
        # Marks the app target so shared files (e.g. OnDeviceAI) can gate app-only
        # seams like AppLaunch that the Share Extension target doesn't compile.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SNAPCEIPT_APP"
        INFOPLIST_FILE: Snapceipt/Info.plist
        CODE_SIGN_ENTITLEMENTS: Snapceipt/Snapceipt.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Staging:
          # Point a Staging build at the isolated staging worker (see docs/STAGING.md).
          SNAPCEIPT_API_HOST: snapceipt-api-staging.techsiderau.workers.dev
        Release:
          CODE_SIGN_ENTITLEMENTS: Snapceipt/Snapceipt.Release.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore app.snapceipt.Snapceipt"
  # Share Extension: makes Snapceipt a target in other apps' share sheets for image/PDF receipts.
  # No UI — it writes the shared file into the App Group inbox; the app imports it on next open.
  SnapceiptShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SnapceiptShareExtension
        excludes:
          - "Info.plist"
          - "SnapceiptShareExtension.entitlements"
      # On-device extraction (OCR + layout rows + Foundation Models) compiled into the
      # extension so its popup reads the receipt itself — no host-app round-trip. These
      # are PURE (Foundation/Vision/CoreGraphics/FoundationModels only); they also build
      # in the app via its `- path: Snapceipt` tree, so they're shared, not duplicated.
      - path: Snapceipt/Model/CategoryKey.swift
      - path: Snapceipt/Features/Capture/ExtractedReceipt.swift
      - path: Snapceipt/Features/Capture/Scanner/DocumentScan.swift
      - path: Snapceipt/Features/Capture/Scanner/OCR.swift
      - path: Snapceipt/Features/Capture/Scanner/ReceiptRows.swift
      - path: Snapceipt/Features/Capture/Scanner/OnDeviceGuards.swift
      - path: Snapceipt/Features/Capture/Scanner/OnDeviceExtracting.swift
      - path: Snapceipt/Features/Capture/Scanner/FoundationModelExtractor.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.snapceipt.Snapceipt.ShareExtension
        INFOPLIST_FILE: SnapceiptShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: SnapceiptShareExtension/SnapceiptShareExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
  SnapceiptTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SnapceiptTests
        excludes:
          - "Fixtures"          # excluded from sources; re-added as a resource below
      - path: SnapceiptTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Snapceipt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.snapceipt.SnapceiptTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Snapceipt.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Snapceipt"
        BUNDLE_LOADER: "$(TEST_HOST)"
  SnapceiptUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SnapceiptUITests
      - path: Snapceipt/Shared/AccessibilityID.swift   # shared constants (UI tests can't @testable-import the app)
    dependencies:
      - target: Snapceipt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.snapceipt.SnapceiptUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Snapceipt
schemes:
  Snapceipt:
    build:
      targets:
        Snapceipt: all
        SnapceiptShareExtension: all
        SnapceiptTests: [test]
        SnapceiptUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Snapceipt/Snapceipt.storekit
    test:
      targets:
        - SnapceiptTests
        - SnapceiptUITests
      gatherCoverageData: false
  # Staging scheme: builds/runs/archives the Staging config (dev-signed, DEBUG features,
  # API_HOST baked to the staging worker). Build with:
  #   xcodebuild -scheme "Snapceipt (Staging)" -configuration Staging ...
  Snapceipt (Staging):
    build:
      targets:
        Snapceipt: all
    run:
      config: Staging
      storeKitConfiguration: Snapceipt/Snapceipt.storekit
    archive:
      config: Staging
