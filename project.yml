name: Snapceipt
options:
  bundleIdPrefix: app.snapceipt
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    # Release archives need (1) DEVELOPMENT_TEAM filled from beta-launch.env
    # (see beta-launch.env.example) and (2) `bundle exec fastlane certs` to
    # install the match profile. Don't fix signing in Xcode's UI — the
    # .xcodeproj is generated from this file.
    DEVELOPMENT_TEAM: "2SU47GHJQX"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Snapceipt:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Snapceipt
        excludes:
          - "Info.plist"
          - "Snapceipt.entitlements"
          - "Snapceipt.Release.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.snapceipt.Snapceipt
        INFOPLIST_FILE: Snapceipt/Info.plist
        CODE_SIGN_ENTITLEMENTS: Snapceipt/Snapceipt.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: Snapceipt/Snapceipt.Release.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore app.snapceipt.Snapceipt"
  SnapceiptTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SnapceiptTests
    dependencies:
      - target: Snapceipt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.snapceipt.SnapceiptTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Snapceipt.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Snapceipt"
        BUNDLE_LOADER: "$(TEST_HOST)"
  SnapceiptUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SnapceiptUITests
      - path: Snapceipt/Shared/AccessibilityID.swift   # shared constants (UI tests can't @testable-import the app)
    dependencies:
      - target: Snapceipt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.snapceipt.SnapceiptUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Snapceipt
schemes:
  Snapceipt:
    build:
      targets:
        Snapceipt: all
        SnapceiptTests: [test]
        SnapceiptUITests: [test]
    test:
      targets:
        - SnapceiptTests
        - SnapceiptUITests
      gatherCoverageData: false
